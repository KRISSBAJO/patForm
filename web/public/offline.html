<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f3f0; color: #1a1a1a; }
  main { max-width: 26rem; padding: 32px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 20px; color: #55534e; line-height: 1.5; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #1f5c3a; color: #fff; font: 600 14px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>The console shows live records and decisions, so it needs a connection. Nothing you had open was lost on the server.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
