<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3d2b">
  <title>Field checklists · Patform</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    :root { --bg: #f6f5f1; --card: #fff; --ink: #1d2420; --muted: #5d6660; --line: #dcdcd4; --brand: #1f3d2b; --warn: #8a5a00; --bad: #b42318; --ok: #1d6b3a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #131614; --card: #1c201d; --ink: #eef0ec; --muted: #a3aba5; --line: #333a35; --brand: #9fd3b1; --warn: #f0b955; --bad: #ff8a80; --ok: #8fd6a6; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { position: sticky; top: 0; background: var(--brand); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    @media (prefers-color-scheme: dark) { header { color: #10170f; } }
    header h1 { font-size: 17px; margin: 0; }
    main { max-width: 640px; margin: 0 auto; padding: 12px 16px 80px; }
    .banner { border-radius: 10px; padding: 10px 12px; margin: 10px 0; border: 1px solid var(--line); background: var(--card); }
    .banner.warn { border-color: var(--warn); }
    .banner.bad { border-color: var(--bad); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 10px 0; }
    .card h2 { font-size: 16px; margin: 0 0 4px; }
    .muted { color: var(--muted); font-size: 14px; }
    button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 10px 14px; min-height: 44px; cursor: pointer; }
    button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    @media (prefers-color-scheme: dark) { button.primary { color: #10170f; } }
    button:disabled { opacity: .5; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .check { border-top: 1px solid var(--line); padding: 10px 0; }
    .check label { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; min-height: 40px; }
    textarea { width: 100%; min-height: 80px; font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 8px; }
    .pill { font-size: 12px; border-radius: 999px; padding: 2px 8px; border: 1px solid currentColor; }
    .overdue { color: var(--bad); } .due { color: var(--warn); }
    a { color: inherit; }
  </style>
</head>
<body>
  <header><h1>Field checklists</h1><span id="net" class="pill">…</span></header>
  <main>
    <div id="status" aria-live="polite"></div>
    <div id="app"><p class="muted">Loading…</p></div>
  </main>
  <script src="/field.js" defer></script>
</body>
</html>
